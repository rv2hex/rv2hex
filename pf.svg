<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="100%" height="100%" style="background-color: #020004;">
  <defs>
    <!-- Red Neon Glow Filter -->
    <filter id="neon-red-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feGaussianBlur stdDeviation="12" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Center Badge Glass Glow -->
    <filter id="badge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Background Gradient -->
    <radialGradient id="matrix-bg-gradient" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3d000b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#120004" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020004" stop-opacity="1"/>
    </radialGradient>

    <!-- Scanline Overlay -->
    <pattern id="scanlines" width="100" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" opacity="0.4"/>
    </pattern>

    <style>
      /* Fall Animations for Rain Layers */
      @keyframes fall-layer-bg {
        0% { transform: translateY(-350px); }
        100% { transform: translateY(650px); }
      }

      @keyframes fall-layer-mid {
        0% { transform: translateY(-420px); }
        100% { transform: translateY(720px); }
      }

      /* Center Badge Pulse */
      @keyframes badge-pulse {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; }
      }

      /* Base Font Settings */
      .matrix-text {
        font-family: 'Courier New', 'Consolas', 'Hiragino Kaku Gothic Pro', 'Yu Gothic', 'Meiryo', monospace;
        text-anchor: middle;
      }

      .bg-rain { animation: fall-layer-bg linear infinite; }
      .mid-rain { animation: fall-layer-mid linear infinite; }

      .badge-border { animation: badge-pulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Background Canvas -->
  <rect width="100%" height="100%" fill="#020004" />
  <rect width="100%" height="100%" fill="url(#matrix-bg-gradient)" />

  <g class="matrix-text" font-size="12" fill="#7a0018" opacity="0.55">
    <g class="bg-rain" style="animation-duration: 7.4s; animation-delay: -4.2s;"><text x="40" y="0"><tspan x="40" dy="0">層</tspan><tspan x="40" dy="14">未</tspan><tspan x="40" dy="14">部</tspan><tspan x="40" dy="14">電</tspan><tspan x="40" dy="14">世</tspan><tspan x="40" dy="14">時</tspan><tspan x="40" dy="14">知</tspan></text></g>
    <g class="bg-rain" style="animation-duration: 7.8s; animation-delay: -0.9s;"><text x="150" y="0"><tspan x="150" dy="0">空</tspan><tspan x="150" dy="14">暗</tspan><tspan x="150" dy="14">制</tspan><tspan x="150" dy="14">終</tspan><tspan x="150" dy="14">空</tspan><tspan x="150" dy="14">空</tspan><tspan x="150" dy="14">世</tspan></text></g>
    <g class="bg-rain" style="animation-duration: 7.5s; animation-delay: -4.5s;"><text x="260" y="0"><tspan x="260" dy="0">神</tspan><tspan x="260" dy="14">構</tspan><tspan x="260" dy="14">層</tspan><tspan x="260" dy="14">漆</tspan><tspan x="260" dy="14">神</tspan><tspan x="260" dy="14">速</tspan><tspan x="260" dy="14">工</tspan></text></g>
    <g class="bg-rain" style="animation-duration: 7.1s; animation-delay: -0.5s;"><text x="370" y="0"><tspan x="370" dy="0">意</tspan><tspan x="370" dy="14">空</tspan><tspan x="370" dy="14">工</tspan><tspan x="370" dy="14">工</tspan><tspan x="370" dy="14">考</tspan></text></g>
    <g class="bg-rain" style="animation-duration: 6.4s; animation-delay: -4.8s;"><text x="480" y="0"><tspan x="480" dy="0">漆</tspan><tspan x="480" dy="14">脳</tspan><tspan x="480" dy="14">未</tspan><tspan x="480" dy="14">実</tspan><tspan x="480" dy="14">界</tspan><tspan x="480" dy="14">由</tspan><tspan x="480" dy="14">世</tspan><tspan x="480" dy="14">能</tspan></text></g>
    <g class="bg-rain" style="animation-duration: 7.3s; animation-delay: -3.9s;"><text x="1030" y="0"><tspan x="1030" dy="0">越</tspan><tspan x="1030" dy="14">習</tspan><tspan x="1030" dy="14">意</tspan><tspan x="1030" dy="14">限</tspan><tspan x="1030" dy="14">神</tspan><tspan x="1030" dy="14">間</tspan></text></g>
    <g class="bg-rain" style="animation-duration: 7.9s; animation-delay: -4.3s;"><text x="1140" y="0"><tspan x="1140" dy="0">焉</tspan><tspan x="1140" dy="14">神</tspan><tspan x="1140" dy="14">速</tspan><tspan x="1140" dy="14">暗</tspan><tspan x="1140" dy="14">量</tspan><tspan x="1140" dy="14">志</tspan><tspan x="1140" dy="14">層</tspan><tspan x="1140" dy="14">漆</tspan></text></g>
    <g class="bg-rain" style="animation-duration: 8.0s; animation-delay: -3.5s;"><text x="1250" y="0"><tspan x="1250" dy="0">赤</tspan><tspan x="1250" dy="14">神</tspan><tspan x="1250" dy="14">意</tspan><tspan x="1250" dy="14">算</tspan><tspan x="1250" dy="14">真</tspan><tspan x="1250" dy="14">終</tspan></text></g>
    <g class="bg-rain" style="animation-duration: 7.3s; animation-delay: -3.1s;"><text x="1360" y="0"><tspan x="1360" dy="0">算</tspan><tspan x="1360" dy="14">志</tspan><tspan x="1360" dy="14">気</tspan><tspan x="1360" dy="14">終</tspan><tspan x="1360" dy="14">内</tspan></text></g>
    <g class="bg-rain" style="animation-duration: 5.7s; animation-delay: -3.7s;"><text x="1470" y="0"><tspan x="1470" dy="0">速</tspan><tspan x="1470" dy="14">能</tspan><tspan x="1470" dy="14">人</tspan><tspan x="1470" dy="14">子</tspan><tspan x="1470" dy="14">来</tspan><tspan x="1470" dy="14">時</tspan><tspan x="1470" dy="14">真</tspan></text></g>
  </g>

  <g class="matrix-text" font-size="16" fill="#ff1a40">
    <g class="mid-rain" style="animation-duration: 5.1s; animation-delay: -1.1s;"><text x="120" y="0"><tspan x="120" dy="0">未</tspan><tspan x="120" dy="14">時</tspan><tspan x="120" dy="14">人</tspan><tspan x="120" dy="14">速</tspan></text></g>
    <g class="mid-rain" style="animation-duration: 5.9s; animation-delay: -2.8s;"><text x="320" y="0"><tspan x="320" dy="0">子</tspan><tspan x="320" dy="14">路</tspan><tspan x="320" dy="14">由</tspan><tspan x="320" dy="14">👾</tspan><tspan x="320" dy="14">👾</tspan><tspan x="320" dy="14">思</tspan></text></g>
    <g class="mid-rain" style="animation-duration: 5.2s; animation-delay: -2.3s;"><text x="520" y="0"><tspan x="520" dy="0">赤</tspan><tspan x="520" dy="14">漆</tspan><tspan x="520" dy="14">空</tspan><tspan x="520" dy="14">焉</tspan><tspan x="520" dy="14">限</tspan><tspan x="520" dy="14">世</tspan></text></g>
    <g class="mid-rain" style="animation-duration: 5.8s; animation-delay: -2.2s;"><text x="980" y="0"><tspan x="980" dy="0">路</tspan><tspan x="980" dy="14">志</tspan><tspan x="980" dy="14">👾</tspan><tspan x="980" dy="14">回</tspan><tspan x="980" dy="14">1</tspan><tspan x="980" dy="14">間</tspan></text></g>
    <g class="mid-rain" style="animation-duration: 5.5s; animation-delay: -2.1s;"><text x="1180" y="0"><tspan x="1180" dy="0">系</tspan><tspan x="1180" dy="14">神</tspan><tspan x="1180" dy="14">電</tspan><tspan x="1180" dy="14">知</tspan></text></g>
    <g class="mid-rain" style="animation-duration: 4.2s; animation-delay: -2.1s;"><text x="1380" y="0"><tspan x="1380" dy="0">1</tspan><tspan x="1380" dy="14">回</tspan><tspan x="1380" dy="14">志</tspan><tspan x="1380" dy="14">👾</tspan><tspan x="1380" dy="14">👾</tspan></text></g>
  </g>

  <g class="mid-rain" style="animation-duration: 5.0s; animation-delay: -2.0s;"><text x="330" y="260" font-size="64" text-anchor="middle" fill="#ff4d6d" filter="url(#neon-red-glow)">👾</text></g>
  <g class="mid-rain" style="animation-duration: 6.2s; animation-delay: -4.1s;"><text x="1170" y="260" font-size="64" text-anchor="middle" fill="#ff4d6d" filter="url(#neon-red-glow)">👾</text></g>

  <!-- CENTER ELEMENT: CYBERPUNK HIGH-TECH BADGE for "rv2hex@github" -->
  <g transform="translate(750, 250)">
    <!-- Ambient Red Glow Behind Center Badge -->
    <rect x="-310" y="-75" width="620" height="150" rx="16" fill="#ff003a" opacity="0.18" filter="url(#badge-glow)" />

    <!-- Backdrop Dark Glassmorphism Container -->
    <rect x="-300" y="-65" width="600" height="130" rx="12" fill="#040008" fill-opacity="0.88" stroke="#ff003d" stroke-width="2.5" class="badge-border"/>

    <!-- Outer Decorative Cyber Corner Brackets -->
    <!-- Top-Left Bracket -->
    <path d="M -315 -50 L -315 -75 L -290 -75" fill="none" stroke="#ff1a47" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Top-Right Bracket -->
    <path d="M 315 -50 L 315 -75 L 290 -75" fill="none" stroke="#ff1a47" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Bottom-Left Bracket -->
    <path d="M -315 50 L -315 75 L -290 75" fill="none" stroke="#ff1a47" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Bottom-Right Bracket -->
    <path d="M 315 50 L 315 75 L 290 75" fill="none" stroke="#ff1a47" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Inner Red Neon Frame Accent Lines -->
    <line x1="-280" y1="-50" x2="280" y2="-50" stroke="#ff0033" stroke-width="1" stroke-dasharray="8 4" opacity="0.6"/>
    <line x1="-280" y1="50" x2="280" y2="50" stroke="#ff0033" stroke-width="1" stroke-dasharray="8 4" opacity="0.6"/>

    <!-- Top Subtitle / Cyber Tag -->
    <text x="0" y="-32" font-family="'Courier New', Monaco, monospace" font-size="12" font-weight="bold" fill="#ff4d6d" letter-spacing="4" text-anchor="middle" opacity="0.95">
      &lt; MATRIX CORE // IDENTITY AUTHORIZED &gt;
    </text>

    <!-- MAIN CENTER TEXT: rv2hex@github -->
    <g filter="url(#head-lead-glow)">
      <!-- Main Text Drop Shadow for Cyber Depth -->
      <text x="2" y="16" font-family="'Consolas', 'Courier New', 'Ubuntu Mono', monospace" font-size="44" font-weight="900" fill="#3a000d" letter-spacing="2" text-anchor="middle">
        rv2hex@github
      </text>
      <!-- Foreground Vivid White-Red Neon Text -->
      <text x="0" y="14" font-family="'Consolas', 'Courier New', 'Ubuntu Mono', monospace" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">
        <tspan fill="#ff335b">rv2hex</tspan><tspan fill="#ffffff">@</tspan><tspan fill="#ff1a40">github</tspan>
      </text>
    </g>

    <!-- Bottom Status Bar -->
    <text x="0" y="38" font-family="'Courier New', Monaco, monospace" font-size="11" font-weight="bold" fill="#ff8093" letter-spacing="3" text-anchor="middle" opacity="0.85">
      [ SYSTEM: ONLINE ] [ SECURE PROTOCOL v2.0 ]
    </text>

    <!-- Small Corner LED Indicators -->
    <circle cx="-280" cy="-40" r="3" fill="#ff0033" />
    <circle cx="-270" cy="-40" r="2" fill="#ff4d6d" opacity="0.7"/>
    <circle cx="280" cy="-40" r="3" fill="#ff0033" />
    <circle cx="270" cy="-40" r="2" fill="#ff4d6d" opacity="0.7"/>
  </g>

  <!-- CRT Monitor Scanlines Overlay Pattern -->
  <rect width="100%" height="100%" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Vignette Border (Cinematic Darkened Borders) -->
  <rect width="100%" height="100%" fill="none" stroke="#020004" stroke-width="26" opacity="0.85"/>
  <rect width="100%" height="100%" fill="none" stroke="#000000" stroke-width="48" opacity="0.45"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" width="100%" height="1150">
  <defs>
    <style>
      @keyframes pulseGlow {
        0%, 100% { text-shadow: 0 0 4px #00ff66, 0 0 8px #00ff66; }
        50% { text-shadow: 0 0 12px #00ff66, 0 0 18px #00ff66; }
      }
      @keyframes matrixRain {
        0% { opacity: 0.05; }
        50% { opacity: 0.35; fill: #00ff66; }
        100% { opacity: 0.05; }
      }
      @keyframes scanline {
        0% { transform: translateY(-20px); }
        100% { transform: translateY(1170px); }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes boxGlow {
        0%, 100% { stroke: #00ff66; filter: drop-shadow(0 0 2px #00ff66); }
        50% { stroke: #00cc55; filter: drop-shadow(0 0 6px #00ff66); }
      }

      .bg-frame { fill: #0a0e14; stroke: #00ff66; stroke-width: 1.5; rx: 12px; animation: boxGlow 4s infinite alternate; }
      .terminal-header { fill: #121820; rx: 12px; }
      .section-box { fill: #050a07; stroke: #005522; stroke-width: 1; rx: 6px; }

      .font-mono { font-family: 'Fira Code', 'Courier New', Consolas, monospace; }
      .text-green { fill: #00ff66; }
      .text-dim { fill: #008833; }
      .text-bright { fill: #66ffaa; }
      .text-white { fill: #e6ffed; }
      .text-yellow { fill: #e6db74; }
      .text-cyan { fill: #a6e22e; }
      .text-diff { fill: #33ff77; font-weight: bold; }

      .header-title { font-size: 14px; fill: #00ff66; font-weight: bold; }
      .section-title { font-size: 18px; font-weight: bold; fill: #00ff66; animation: pulseGlow 3s infinite alternate; }
      .cursor { fill: #00ff66; animation: cursorBlink 0.8s infinite; }
      
      .matrix-bg { font-size: 12px; fill: #003311; animation: matrixRain 3s infinite ease-in-out; }
      .scanline { fill: url(#scan-grad); opacity: 0.15; animation: scanline 4s linear infinite; }
    </style>

    <linearGradient id="scan-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff66" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer Dark Frame -->
  <rect width="796" height="1146" x="2" y="2" class="bg-frame" />

  <!-- Top Window Header Bar -->
  <rect width="796" height="36" x="2" y="2" class="terminal-header" />
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />
  <text x="400" y="24" text-anchor="middle" class="font-mono header-title">rv2hex@sec-terminal:~ (zsh)</text>

  <!-- Background Matrix Rain Binary Stream -->
  <g class="font-mono matrix-bg">
    <text x="20" y="70" style="animation-delay: 0.2s;">01000011 01111001 01100010 01100101 01110010 01110011 01100101 01100011</text>
    <text x="420" y="70" style="animation-delay: 1.1s;">01010000 01111001 01110100 01101000 01101111 01101110 00111000</text>
    <text x="150" y="400" style="animation-delay: 0.5s;">01001101 01010110 01010000 00100000 01010000 01100001 01110100 01110100</text>
    <text x="50" y="800" style="animation-delay: 0.9s;">01010011 01010001 01001100 00100000 01010011 01100101 01100011 01110101</text>
  </g>

  <!-- ================= SECTION 0: SYSTEM STATUS BANNER ================= -->
  <rect x="20" y="55" width="756" height="105" class="section-box" stroke="#00ff66" />
  <g class="font-mono" font-size="14">
    <text x="40" y="85" class="text-diff">+ [SYS_STATUS]: SYSTEM ONLINE</text>
    <text x="40" y="110" class="text-diff">+ [OPERATOR]: rv2hex</text>
    <text x="40" y="135" class="text-diff">+ [PRIMARY_DIRECTIVE]: Cybersecurity | Python Scripting | Application Security</text>
  </g>

  <!-- ================= SECTION 1: ABOUT ME ================= -->
  <text x="20" y="200" class="font-mono section-title">🟢 0x01 // ABOUT_ME</text>
  
  <rect x="20" y="215" width="756" height="280" class="section-box" />
  <g class="font-mono" font-size="13">
    <!-- Command Prompt -->
    <text x="40" y="245" class="text-green" font-weight="bold">$ cat profile.json</text>
    <rect x="195" y="233" width="8" height="15" class="cursor" />

    <!-- JSON Tree -->
    <text x="40" y="275" class="text-dim">{</text>
    <text x="60" y="295" class="text-cyan">  "user": <tspan class="text-yellow">"rv2hex"</tspan>,</text>
    <text x="60" y="320" class="text-cyan">  "interests": <tspan class="text-dim">[</tspan><tspan class="text-yellow">"Cybersecurity"</tspan><tspan class="text-dim">, </tspan><tspan class="text-yellow">"Security Scripting"</tspan><tspan class="text-dim">, </tspan><tspan class="text-yellow">"Automation"</tspan><tspan class="text-dim">],</tspan></text>
    <text x="60" y="345" class="text-cyan">  "learning": <tspan class="text-dim">[</tspan><tspan class="text-yellow">"Python"</tspan><tspan class="text-dim">, </tspan><tspan class="text-yellow">"Java"</tspan><tspan class="text-dim">, </tspan><tspan class="text-yellow">"Secure Web Architecture"</tspan><tspan class="text-dim">],</tspan></text>
    <text x="60" y="370" class="text-cyan">  "architecture_patterns": <tspan class="text-dim">[</tspan><tspan class="text-yellow">"MVP (Model-View-Presenter)"</tspan><tspan class="text-dim">],</tspan></text>
    <text x="60" y="395" class="text-cyan">  "collaborate_on": <tspan class="text-dim">[</tspan><tspan class="text-yellow">"Security Tools"</tspan><tspan class="text-dim">, </tspan><tspan class="text-yellow">"Python Automation"</tspan><tspan class="text-dim">, </tspan><tspan class="text-yellow">"Java Web Applications"</tspan><tspan class="text-dim">],</tspan></text>
    <text x="60" y="420" class="text-cyan">  "contact": <tspan class="text-yellow">"rv2hex@gmail.com"</tspan></text>
    <text x="40" y="445" class="text-dim">}</text>
    <text x="40" y="475" class="text-green">$ _</text>
  </g>

  <!-- ================= SECTION 2: TECH STACK ================= -->
  <text x="20" y="535" class="font-mono section-title">🛠️ 0x02 // TECH_STACK &amp; TOOLING</text>
  
  <rect x="20" y="550" width="756" height="330" class="section-box" />
  <g class="font-mono">
    <!-- Languages Diff Box -->
    <text x="40" y="580" class="text-bright" font-size="14" font-weight="bold">💻 Scripting &amp; Languages</text>
    
    <g font-size="13">
      <text x="50" y="610" class="text-diff">+ Python        [ Security Scripting &amp; Automation ]</text>
      <text x="50" y="635" class="text-diff">+ Java          [ Application Development ]</text>
      <text x="50" y="660" class="text-diff">+ SQL           [ Database Queries &amp; Management ]</text>
      <text x="50" y="685" class="text-diff">+ Bash/Shell    [ System Command Scripting ]</text>
    </g>

    <!-- Databases & Web Servers Badges -->
    <text x="40" y="730" class="text-bright" font-size="14" font-weight="bold">🗄️ Databases &amp; Web Servers</text>
    <g transform="translate(40, 745)">
      <!-- MySQL Badge -->
      <rect x="0" y="0" width="100" height="28" fill="#002200" stroke="#00ff66" rx="4"/>
      <text x="50" y="18" text-anchor="middle" class="text-green" font-size="12" font-weight="bold">MySQL</text>

      <!-- Apache Tomcat Badge -->
      <rect x="115" y="0" width="140" height="28" fill="#002200" stroke="#00ff66" rx="4"/>
      <text x="185" y="18" text-anchor="middle" class="text-green" font-size="12" font-weight="bold">Apache Tomcat</text>

      <!-- XAMPP Badge -->
      <rect x="270" y="0" width="90" height="28" fill="#002200" stroke="#00ff66" rx="4"/>
      <text x="315" y="18" text-anchor="middle" class="text-green" font-size="12" font-weight="bold">XAMPP</text>
    </g>

    <!-- IDEs & System Tools Badges -->
    <text x="40" y="810" class="text-bright" font-size="14" font-weight="bold">⚙️ IDEs &amp; System Tools</text>
    <g transform="translate(40, 825)">
      <!-- Eclipse Badge -->
      <rect x="0" y="0" width="100" height="28" fill="#002200" stroke="#00ff66" rx="4"/>
      <text x="50" y="18" text-anchor="middle" class="text-green" font-size="12" font-weight="bold">Eclipse</text>

      <!-- MySQL Workbench Badge -->
      <rect x="115" y="0" width="160" height="28" fill="#002200" stroke="#00ff66" rx="4"/>
      <text x="195" y="18" text-anchor="middle" class="text-green" font-size="12" font-weight="bold">MySQL Workbench</text>

      <!-- Git Badge -->
      <rect x="290" y="0" width="70" height="28" fill="#002200" stroke="#00ff66" rx="4"/>
      <text x="325" y="18" text-anchor="middle" class="text-green" font-size="12" font-weight="bold">Git</text>
    </g>
  </g>

  <!-- ================= SECTION 3: TARGET OBJECTIVES ================= -->
  <text x="20" y="920" class="font-mono section-title">🎯 0x03 // TARGET_OBJECTIVES</text>
  
  <rect x="20" y="935" width="756" height="175" class="section-box" />
  <g class="font-mono" font-size="13">
    <!-- Objective 1 (Completed) -->
    <text x="40" y="968" class="text-green" font-weight="bold">[x]</text>
    <text x="75" y="968" class="text-white">Open konsole once</text>

    <!-- Objective 2 -->
    <text x="40" y="1000" class="text-dim">[ ]</text>
    <text x="75" y="1000" class="text-dim">Develop automated Python scripts for vulnerability scanning &amp; log analysis</text>

    <!-- Objective 3 -->
    <text x="40" y="1032" class="text-dim">[ ]</text>
    <text x="75" y="1032" class="text-dim">Build secure Java web applications using Apache Tomcat and MySQL</text>

    <!-- Objective 4 -->
    <text x="40" y="1064" class="text-dim">[ ]</text>
    <text x="75" y="1064" class="text-dim">Implement MVP (Model-View-Presenter) design pattern in security tools</text>
  </g>

  <!-- Scanline Moving Animation Effect -->
  <rect x="2" y="0" width="796" height="25" class="scanline" />
</svg>
